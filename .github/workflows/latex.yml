name: Build LaTeX document

on:
  push:
    branches: [ main, master ]
    paths:
      - '**.tex'
      - '**.bib'
      - 'figures/**'
      - 'preamble/**'
      - '.latexmkrc'
      - '.github/workflows/**'
      - 'web/**'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build_latex:
    runs-on: ubuntu-latest
    env:
      # job level, so the deploy step can check whether it is set (secrets cannot be used in `if:`)
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Create build directories
        run: |
          mkdir -p build/chapters/dodatky
          mkdir -p build/preamble/{debug,environments,general,hacks,layout,math,misc,references,user}
      
      # both editions (print/desktop and phone), with the repository's .latexmkrc (LuaLaTeX, out_dir build)
      - name: Compile LaTeX document
        uses: xu-cheng/latex-action@v3
        with:
          root_file: |
            main.tex
            mobile.tex
          compiler: latexmk
          args: -file-line-error -interaction=nonstopmode
          working_directory: .
      
      # web edition and EPUB from the same sources (web/build.sh); the LaTeX step ran in a
      # container as root, so build/ is handed back to the runner user first
      - name: Set up pandoc
        uses: pandoc/actions/setup@v1
        with:
          version: 3.7.0.2

      - name: Build web edition and EPUB
        continue-on-error: true   # a problem in the web edition must not stop the PDFs from being published
        run: |
          sudo chown -R "$(id -u):$(id -g)" build
          sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends imagemagick poppler-utils >/dev/null
          bash web/build.sh

      - name: Upload PDF and EPUB artifact
        uses: actions/upload-artifact@v4
        with:
          name: PDF
          path: |
            build/*.pdf
            build/asterion.epub
      
      # exactly the published files (no .aux/.log from build/): the page, PDFs, EPUB, web edition
      - name: Assemble site
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        run: |
          rm -rf site && mkdir site
          if [ -f build/index.html ]; then
            cp build/index.html site/   # the landing page, generated by web/build.sh
          else                          # web build failed: still publish the PDFs with a plain page
            printf '<!DOCTYPE html><meta charset="utf-8"><title>Fate Core: Asterion Hack</title><h1>Fate Core: Asterion Hack</h1><ul><li><a href="main.pdf">PDF pro počítač</a></li><li><a href="mobile.pdf">PDF pro mobil</a></li></ul>\n' > site/index.html
          fi
          cp build/main.pdf build/mobile.pdf site/
          if [ -f build/asterion.epub ]; then cp build/asterion.epub site/; fi
          if [ -d build/web ]; then cp -r build/web site/; fi
          ls -la site

      # https://kamilbelan.net/fate-asterion/ (kb-vps, Caddy). The deploy key can only write into
      # /var/www/fate-asterion (rrsync on the server), see web/README.md. Skipped while the
      # DEPLOY_SSH_KEY secret is not set.
      - name: Deploy to kamilbelan.net
        if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && env.DEPLOY_SSH_KEY != ''
        env:
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          rsync -rlptvz --delete -e "ssh -i ~/.ssh/deploy -o IdentitiesOnly=yes" \
            site/ moschehaus@89.167.19.41:
          rm -f ~/.ssh/deploy
          
      - name: Release PDF (on tag push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            build/*.pdf
            build/asterion.epub
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
